name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest
      - run: python -m pytest -q
      - run: |
          python -m kyb triage --cases data/cases --as-of 2026-09-23T10:00:00Z --out /tmp/out
          python -m kyb verify --log /tmp/out/audit.jsonl
